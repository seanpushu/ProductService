AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  One-time bootstrap for Product Service CI/CD: GitHub OIDC provider, the role
  GitHub Actions assumes (main branch only), and the CloudFormation execution
  role that actually changes infrastructure. Deployed manually by an admin.

Parameters:
  GitHubRepo:
    Type: String
    Default: seanpushu/ProductService
  AppStackName:
    Type: String
    Default: productservice-app
  EcrRepositoryName:
    Type: String
    Default: productservice
  HostedZoneId:
    Type: AWS::Route53::HostedZone::Id
  CreateOidcProvider:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']

Conditions:
  MakeOidc: !Equals [!Ref CreateOidcProvider, 'true']

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: MakeOidc
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]
      # AWS no longer uses this thumbprint for GitHub, but the field is required.
      ThumbprintList: [6938fd4d98bab03faadb97b34396831e3780aea1]

  # CloudFormation uses this role (not the GitHub role) to create resources.
  CfnExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: productservice-cfn-exec
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: cloudformation.amazonaws.com}
            Action: sts:AssumeRole
            Condition:
              StringEquals: {aws:SourceAccount: !Ref AWS::AccountId}
      Policies:
        - PolicyName: productservice-app-resources
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: Network
                Effect: Allow
                Action:
                  - ec2:Describe*
                  - ec2:CreateSecurityGroup
                  - ec2:DeleteSecurityGroup
                  - ec2:AuthorizeSecurityGroupIngress
                  - ec2:RevokeSecurityGroupIngress
                  - ec2:AuthorizeSecurityGroupEgress
                  - ec2:RevokeSecurityGroupEgress
                  - ec2:CreateTags
                  - ec2:DeleteTags
                Resource: '*'
              - Sid: LoadBalancer
                Effect: Allow
                Action: elasticloadbalancing:*
                Resource: '*'
              - Sid: Ecs
                Effect: Allow
                Action:
                  - ecs:RegisterTaskDefinition
                  - ecs:DeregisterTaskDefinition
                  - ecs:DescribeTaskDefinition
                  - ecs:CreateService
                  - ecs:UpdateService
                  - ecs:DeleteService
                  - ecs:DescribeServices
                  - ecs:DescribeClusters
                  - ecs:ListTasks
                  - ecs:DescribeTasks
                  - ecs:TagResource
                  - ecs:UntagResource
                Resource: '*'
              - Sid: TaskRoles
                Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:GetRole
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:UpdateAssumeRolePolicy
                  - iam:PutRolePolicy
                  - iam:GetRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:ListRolePolicies
                  - iam:ListAttachedRolePolicies
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                Resource: !Sub 'arn:aws:iam::${AWS::AccountId}:role/${AppStackName}-*'
              - Sid: PassTaskRoles
                Effect: Allow
                Action: iam:PassRole
                Resource: !Sub 'arn:aws:iam::${AWS::AccountId}:role/${AppStackName}-*'
                Condition:
                  StringEquals: {iam:PassedToService: ecs-tasks.amazonaws.com}
              - Sid: Dns
                Effect: Allow
                Action: [route53:ChangeResourceRecordSets, route53:ListResourceRecordSets]
                Resource: !Sub 'arn:aws:route53:::hostedzone/${HostedZoneId}'
              - Sid: DnsRead
                Effect: Allow
                Action: [route53:GetChange, route53:GetHostedZone, route53:ListHostedZones]
                Resource: '*'
              - Sid: CertRead
                Effect: Allow
                Action: [acm:DescribeCertificate, acm:ListCertificates]
                Resource: '*'

  # Assumed by GitHub Actions through OIDC, only from pushes/dispatches on main
  # of the one repository. It can push images and drive the one app stack.
  GitHubDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: productservice-github-deploy
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - MakeOidc
                - !Ref GitHubOidcProvider
                - !Sub 'arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com'
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub 'repo:${GitHubRepo}:ref:refs/heads/main'
      Policies:
        - PolicyName: push-image
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - {Effect: Allow, Action: ecr:GetAuthorizationToken, Resource: '*'}
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
                  - ecr:PutImage
                  - ecr:BatchGetImage
                  - ecr:DescribeImages
                Resource: !Sub 'arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/${EcrRepositoryName}'
        - PolicyName: deploy-app-stack
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - cloudformation:CreateStack
                  - cloudformation:UpdateStack
                  - cloudformation:CreateChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:DeleteChangeSet
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:GetTemplateSummary
                Resource:
                  - !Sub 'arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AppStackName}/*'
                  - !Sub 'arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:changeSet/*'
              - {Effect: Allow, Action: cloudformation:ValidateTemplate, Resource: '*'}
              - Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt CfnExecutionRole.Arn
              - Sid: VerifyDeployment
                Effect: Allow
                Action:
                  - ecs:DescribeServices
                  - ecs:DescribeTaskDefinition
                  - ecs:ListTasks
                  - ecs:DescribeTasks
                  - elasticloadbalancing:DescribeTargetHealth
                  - elasticloadbalancing:DescribeTargetGroups
                Resource: '*'

Outputs:
  GitHubDeployRoleArn:
    Description: Put this in the repo secret AWS_ROLE_ARN
    Value: !GetAtt GitHubDeployRole.Arn
  CfnExecutionRoleArn:
    Value: !GetAtt CfnExecutionRole.Arn

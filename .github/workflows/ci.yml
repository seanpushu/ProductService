name: CI

# Runs on every pull request, and is called by deploy.yml for every push to
# main, so a deploy only happens after the same commit passed these checks.
# Needs no AWS credentials and never touches production data.
on:
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Tests (SQLite + PostgreSQL 16)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: products_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d products_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      # Throwaway CI database; conftest.py refuses anything not ending in _test.
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/products_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: pytest
        run: python -m pytest -v
      - name: Fail if PostgreSQL tests were skipped
        run: |
          python -m pytest tests/test_postgres_integration.py -q -rs | tee pg.txt
          if grep -q "skipped" pg.txt; then echo "PostgreSQL tests skipped"; exit 1; fi

  docker:
    name: Docker build + smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build linux/amd64 image
        run: docker build --platform linux/amd64 --build-arg GIT_SHA=${{ github.sha }} -t productservice:ci .
      - name: Container listens on 0.0.0.0:8080 and serves /health
        run: |
          docker network create ci
          docker run -d --name db --network ci -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=products postgres:16
          for i in $(seq 1 30); do docker exec db pg_isready -U postgres -d products && break; sleep 2; done
          docker run -d --name api --network ci -p 8080:8080 \
            -e DATABASE_URL=postgresql+psycopg://postgres:postgres@db:5432/products productservice:ci
          for i in $(seq 1 30); do curl -fsS http://localhost:8080/health && break; sleep 2; done
          curl -fsS http://localhost:8080/health
          curl -fsS http://localhost:8080/products | grep -q '"items"'
          curl -fsS http://localhost:8080/version | grep -q '${{ github.sha }}'
      - if: failure()
        run: docker logs api || true

  infra:
    name: CloudFormation lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install cfn-lint==1.22.0
      - run: cfn-lint infra/*.yml
